name: Gerar APK Android

on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar código
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Normalizar Configurações do Projeto
      run: |
        rm -f build.gradle settings.gradle build.gradle.kts settings.gradle.kts gradle.properties

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "copiloto"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.4'
                classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.20'
            }
        }
        EOF

        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.nonTransitiveRClass=false
        kotlin.suppressKotlinVersionCompatibilityCheck=true
        kotlin.jvm.target.validation.mode=warning
        EOF

    - name: Forçar Atualização do Compose Compiler
      run: |
        # Substitui a versão antiga em qualquer arquivo da pasta app
        find app/ -type f \( -name "build.gradle*" -o -name "*.kt" \) -exec sed -i 's/1.3.2/1.4.6/g' {} +

        # Injeta a instrução de liberação no build.gradle do app
        APP_GRADLE=$(find app -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
        if [ -n "$APP_GRADLE" ]; then
          cat << 'EOF' >> "$APP_GRADLE"

        android {
            kotlinOptions {
                freeCompilerArgs += [
                    "-P",
                    "plugin:androidx.compose.compiler.plugins.kotlin:suppressKotlinVersionCompatibilityCheck=true"
                ]
            }
        }
        EOF
        fi

    - name: Injetar Tema de Suporte
      run: |
        mkdir -p app/src/main/res/values
        cat << 'EOF' > app/src/main/res/values/auto_generated_themes.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="Theme.CopilotoAuto" parent="android:Theme.Material.Light.NoActionBar" />
        </resources>
        EOF

    - name: Compilar APK e Diagnosticar
      run: |
        gradle assembleDebug --console=plain > build_output.log 2>&1 || {
          echo "==================== MOTIVO EXATO DA FALHA ===================="
          grep -E "e: |Error:|FAILED:|AAPT:" build_output.log | head -n 30
          echo "=============================================================="
          exit 1
        }

    - name: Salvar APK Gerado
      uses: actions/upload-artifact@v4
      with:
        name: copiloto-apk
        path: "**/build/outputs/apk/debug/*.apk"
