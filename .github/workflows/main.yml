name: Gerar APK Android

on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar código
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Configurar Estrutura e Atualizar Compose
      run: |
        rm -f build.gradle settings.gradle build.gradle.kts settings.gradle.kts gradle.properties

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "copiloto"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.4'
                classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.20'
            }
        }
        EOF

        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        kotlin.suppressKotlinVersionCompatibilityCheck=true
        kotlin.jvm.target.validation.mode=warning
        EOF

        APP_BUILD=$(find app -name "build.gradle*" | head -n 1)
        if [ -n "$APP_BUILD" ]; then
          sed -i 's/kotlinCompilerExtensionVersion.*/kotlinCompilerExtensionVersion = "1.4.6"/g' "$APP_BUILD"
        fi

    - name: Injetar Tema de Suporte
      run: |
        mkdir -p app/src/main/res/values
        cat << 'EOF' > app/src/main/res/values/auto_generated_themes.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="Theme.CopilotoAuto" parent="android:Theme.Material.Light.NoActionBar" />
        </resources>
        EOF

    - name: Compilar APK
      run: gradle assembleDebug --stacktrace --console=plain

    - name: Salvar APK Gerado
      uses: actions/upload-artifact@v4
      with:
        name: copiloto-apk
        path: "**/build/outputs/apk/debug/*.apk"
