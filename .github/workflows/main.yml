name: Gerar APK Android

on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar código
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Criar Arquivos Raiz Ausentes
      run: |
        if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
          echo 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' > settings.gradle.kts
          echo 'dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }' >> settings.gradle.kts
          echo 'rootProject.name = "copiloto"' >> settings.gradle.kts
          echo 'include(":app")' >> settings.gradle.kts
        fi

        if [ ! -f "build.gradle.kts" ] && [ ! -f "build.gradle" ]; then
          echo 'plugins {' > build.gradle.kts
          echo '    id("com.android.application") version "8.2.2" apply false' >> build.gradle.kts
          echo '    id("org.jetbrains.kotlin.android") version "1.9.22" apply false' >> build.gradle.kts
          echo '}' >> build.gradle.kts
        fi

    - name: Criar Executável e Compilar
      run: |
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Salvar APK para Download
      uses: actions/upload-artifact@v4
      with:
        name: copiloto-apk
        path: "**/build/outputs/apk/debug/*.apk"
