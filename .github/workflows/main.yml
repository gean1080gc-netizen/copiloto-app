name: Gerar APK Android

on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar código
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Configurar Estrutura do Projeto
      run: |
        rm -f build.gradle settings.gradle build.gradle.kts settings.gradle.kts

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "copiloto"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.4'
                classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.20'
            }
        }
        EOF

    - name: Injetar Tema de Suporte
      run: |
        mkdir -p app/src/main/res/values
        cat << 'EOF' > app/src/main/res/values/auto_generated_themes.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="Theme.CopilotoAuto" parent="android:Theme.Material.Light.NoActionBar" />
        </resources>
        EOF

    - name: Compilar APK e Filtrar Erro
      run: |
        gradle assembleDebug \
          -Pkotlin.jvm.target.validation.mode=warning \
          -Pandroid.suppressUnsupportedCompileSdk=33 \
          --console=plain > build.log 2>&1 || {
            echo "================ DIAGNÓSTICO DO ERRO ================"
            grep -E -i "e:|aapt|error:|failure:|xml" build.log -B 2 -A 5 || tail -n 30 build.log
            exit 1
          }

    - name: Salvar APK Gerado
      uses: actions/upload-artifact@v4
      with:
        name: copiloto-apk
        path: "**/build/outputs/apk/debug/*.apk"
