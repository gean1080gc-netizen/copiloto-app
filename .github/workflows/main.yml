name: Gerar APK Android

on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar código
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar Android SDK
      uses: android-actions/setup-android@v3

    - name: Criar Arquivos Raiz (.kts)
      run: |
        rm -f build.gradle settings.gradle

        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "copiloto"
        include(":app")
        EOF

        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.2.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.22" apply false
        }
        EOF

    - name: Injetar Tema e Dependências Ausentes
      run: |
        FILE=$(find app -name "build.gradle*" | head -n 1)
        if [ -n "$FILE" ]; then
          echo "" >> "$FILE"
          echo "dependencies {" >> "$FILE"
          echo '    implementation("com.google.android.material:material:1.11.0")' >> "$FILE"
          echo '    implementation("androidx.appcompat:appcompat:1.6.1")' >> "$FILE"
          echo "}" >> "$FILE"
        fi

        mkdir -p app/src/main/res/values
        cat << 'EOF' > app/src/main/res/values/auto_generated_themes.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="Theme.CopilotoAuto" parent="Theme.AppCompat.Light.NoActionBar">
            </style>
        </resources>
        EOF

    - name: Gerar Executável Gradle 8.2
      run: gradle wrapper --gradle-version 8.2

    - name: Dar permissão no wrapper
      run: chmod +x gradlew

    - name: Compilar APK
      run: ./gradlew assembleDebug

    - name: Salvar APK para Download
      uses: actions/upload-artifact@v4
      with:
        name: copiloto-apk
        path: "**/build/outputs/apk/debug/*.apk"
